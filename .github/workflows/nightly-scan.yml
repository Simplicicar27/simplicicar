name: Scan nocturne du catalogue Simplicicar

on:
  schedule:
      # 01:00 UTC = 02:00 (hiver) ou 03:00 (été) heure de Paris
          - cron: '0 1 * * *'
            workflow_dispatch: {}   # permet de lancer manuellement depuis l'onglet "Actions"

            permissions:
              contents: write

              jobs:
                scan:
                    runs-on: ubuntu-latest
                        steps:
                              - name: Checkout du dépôt
                                      uses: actions/checkout@v4

                                            - name: Installer Python
                                                    uses: actions/setup-python@v5
                                                            with:
                                                                      python-version: '3.11'

                                                                            - name: Installer les dépendances
                                                                                    working-directory: scraper
                                                                                            run: |
                                                                                                      pip install -r requirements.txt
                                                                                                                playwright install --with-deps chromium
                                                                                                                
                                                                                                                      - name: Lancer le scraper
                                                                                                                              working-directory: scraper
                                                                                                                                      env:
                                                                                                                                                SIMPLICICAR_EMAIL: ${{ secrets.SIMPLICICAR_EMAIL }}
                                                                                                                                                          SIMPLICICAR_PASSWORD: ${{ secrets.SIMPLICICAR_PASSWORD }}
                                                                                                                                                                  run: python scrape.py
                                                                                                                                                                  
                                                                                                                                                                        - name: Commit et push si le catalogue a changé
                                                                                                                                                                                run: |
                                                                                                                                                                                          git config user.name "github-actions[bot]"
                                                                                                                                                                                                    git config user.email "github-actions[bot]@users.noreply.github.com"
                                                                                                                                                                                                              git add docs/data.json
                                                                                                                                                                                                                        if git diff --cached --quiet; then
                                                                                                                                                                                                                                    echo "Aucun changement détecté dans le catalogue."
                                                                                                                                                                                                                                              else
                                                                                                                                                                                                                                                          git commit -m "Mise à jour nocturne du catalogue ($(date -u +'%Y-%m-%d %H:%M') UTC)"
                                                                                                                                                                                                                                                                      git push
                                                                                                                                                                                                                                                                                fi
