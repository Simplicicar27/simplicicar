<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simplicicar Évreux — Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Palette calquée sur simplicicar.com : marine + rose magenta, fond clair. */
  :root{
    --bg: #F0F2F1;
    --surface: #FFFFFF;
    --border: rgba(26,38,57,0.10);
    --navy: #1A2639;
    --navy-soft: #454E5D;
    --text-dim: #6B7385;
    --pink: #DB407A;
    --pink-soft: #E993B6;
    --pink-bg: rgba(219,64,122,0.10);
    --green: #2E9E6C;
    --green-bg: rgba(46,158,108,0.10);
    --amber: #C9862A;
    --amber-bg: rgba(201,134,42,0.12);
    --grey-bg: rgba(26,38,57,0.06);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg); color: var(--navy);
    font-family:'Manrope',sans-serif;
    overflow:hidden;
  }
  .display-font{ font-family:'Be Vietnam Pro',sans-serif; }

  .screen{
    width:100vw; height:100vh;
    display:flex; flex-direction:column;
  }

  header{
    display:flex; align-items:center; justify-content:space-between;
    padding: 30px 48px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand .mark{
    width:14px; height:14px; border-radius:50%;
    background: var(--pink); flex-shrink:0;
  }
  .brand .eyebrow{
    font-family:'Be Vietnam Pro',sans-serif; font-weight:300;
    font-size: 18px; letter-spacing:0.02em; text-transform:uppercase;
    color: var(--text-dim); line-height:1;
  }
  .brand h1{
    font-family:'Be Vietnam Pro',sans-serif; font-weight:800;
    font-size: 36px; margin:4px 0 0; letter-spacing:-0.01em; line-height:1;
    color: var(--navy);
  }
  .clock{ text-align:right; }
  .clock .time{ font-family:'Be Vietnam Pro',sans-serif; font-weight:800; font-size:38px; line-height:1; color:var(--navy); }
  .clock .date{ font-size:14px; color:var(--text-dim); margin-top:6px; text-transform:capitalize; }

  .stats{
    display:flex; gap:14px; padding: 18px 48px;
    background: var(--bg);
  }
  .stat{
    background: var(--surface); border:1px solid var(--border); border-radius:12px;
    padding: 12px 22px; display:flex; align-items:baseline; gap:10px;
  }
  .stat .num{ font-family:'Be Vietnam Pro',sans-serif; font-weight:800; font-size:26px; }
  .stat .label{ font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; }
  .stat.total .num{ color: var(--pink); }
  .stat.v .num{ color: var(--green); }
  .stat.r .num{ color: var(--amber); }

  main{
    flex:1; padding: 6px 48px 24px; position:relative; overflow:hidden;
  }
  .page{
    position:absolute; inset: 6px 48px 24px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
    opacity:0;
    transform: translateY(14px);
    transition: opacity 0.6s ease, transform 0.6s ease;
    pointer-events:none;
  }
  .page.active{ opacity:1; transform:none; pointer-events:auto; }

  .card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    overflow:hidden; display:flex; flex-direction:column;
    box-shadow: 0 1px 2px rgba(26,38,57,0.04);
  }
  .photo{
    position:relative; aspect-ratio: 4/3; background:#E3E6E5; overflow:hidden;
  }
  .photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo .noimg{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); font-size:13px; font-family:'Manrope',sans-serif; font-weight:600;
    text-transform:uppercase; letter-spacing:0.05em;
  }
  .status{
    position:absolute; top:12px; left:12px; font-size:12px; font-weight:700;
    padding:5px 11px; border-radius:999px; text-transform:uppercase; letter-spacing:0.03em;
    backdrop-filter: blur(4px);
  }
  .status.v{ background:rgba(255,255,255,0.9); color:var(--green); box-shadow: inset 0 0 0 1px rgba(46,158,108,0.35); }
  .status.r{ background:rgba(255,255,255,0.9); color:var(--amber); box-shadow: inset 0 0 0 1px rgba(201,134,42,0.35); }
  .status.d{ background:rgba(255,255,255,0.9); color:var(--navy-soft); box-shadow: inset 0 0 0 1px rgba(26,38,57,0.2); }
  .status.l{ background:rgba(255,255,255,0.9); color:var(--green); box-shadow: inset 0 0 0 1px rgba(46,158,108,0.35); }

  .card-body{ padding: 16px 18px 18px; display:flex; flex-direction:column; gap:8px; flex:1; }
  .title{ font-family:'Be Vietnam Pro',sans-serif; font-weight:700; font-size:19px; margin:0; line-height:1.2; color:var(--navy); }
  .variant{ font-size:13px; color:var(--text-dim); line-height:1.3; margin:0; min-height:2.6em; }
  .meta{ display:flex; flex-wrap:wrap; gap:5px 10px; font-size:12.5px; color:var(--text-dim); }
  .meta span::after{ content:'·'; margin-left:8px; color:var(--border); }
  .meta span:last-child::after{ content:''; }
  .footer-row{
    margin-top:auto; display:flex; align-items:center; justify-content:space-between;
    padding-top:10px; border-top:1px solid var(--border);
  }
  .plate{
    font-family:'Manrope',sans-serif; font-size:12.5px; font-weight:700; color:var(--navy);
    background: var(--pink-bg); border:1px solid rgba(219,64,122,0.25);
    border-radius:5px; padding:4px 9px; letter-spacing:0.02em;
  }
  /* Reprend le style exact des pastilles de prix de simplicicar.com */
  .price{
    font-family:'Manrope',sans-serif; font-weight:700; font-size:16px;
    color:#F0F2F1; background: var(--navy-soft);
    border-radius:7px; padding:5px 12px;
  }
  .price.na{ color:var(--text-dim); font-size:13px; font-weight:500; background:transparent; padding:0; }

  footer{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 48px 20px; border-top:1px solid var(--border);
    color: var(--text-dim); font-size:12.5px;
    background: var(--surface);
  }
  .dots{ display:flex; gap:8px; }
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--border); transition: background 0.3s; }
  .dot.active{ background: var(--pink); }

  .offline-banner{
    position:fixed; bottom:20px; right:48px;
    background: #FDECF2; border:1px solid rgba(219,64,122,0.35); color: var(--pink);
    padding: 8px 16px; border-radius:8px; font-size:13px; display:none; font-weight:600;
  }
  .offline-banner.show{ display:block; }
</style>
</head>
<body>
<div class="screen">
  <header>
    <div class="brand">
      <span class="mark"></span>
      <div>
        <div class="eyebrow">simplicicar</div>
        <h1 class="display-font">Le catalogue Évreux</h1>
      </div>
    </div>
    <div class="clock">
      <div class="time display-font" id="time">--:--</div>
      <div class="date" id="date">—</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <main>
    <div id="pages"></div>
  </main>

  <footer>
    <span id="updatedAt">Chargement…</span>
    <div class="dots" id="dots"></div>
    <span id="pageIndicator">—</span>
  </footer>
</div>
<div class="offline-banner" id="offlineBanner">Données non actualisées — dernière synchronisation ci-dessous</div>

<script>
const DATA_URL = 'data.json';
const PAGE_SIZE = 8;              // véhicules affichés simultanément (grille 4x2)
const ROTATE_MS = 12000;          // durée d'affichage de chaque page
const REFETCH_MS = 5 * 60 * 1000; // re-vérifie data.json toutes les 5 min
const RELOAD_HOUR = 4;            // recharge complète de la page chaque jour à 4h (pile fraîche)

const FUEL_LABEL = { D: 'Gazole', E: 'Essence' };
const TRANS_LABEL = { M: 'Manuelle', A: 'Automatique' };
const STATUS_LABEL = { V: 'En vente', R: 'Réservé', D: 'Mandat dépassé', L: 'Vendu / Livré' };
const STATUS_CLASS = { V: 'v', R: 'r', D: 'd', L: 'l' };

let vehicles = [];
let pages = [];
let currentPage = 0;
let rotateTimer = null;
let lastLoadedDay = new Date().getDate();

function fmtPrice(p){ return p ? p.toLocaleString('fr-FR') + ' €' : 'Prix sur demande'; }
function fmtKm(k){ return (k ?? 0).toLocaleString('fr-FR') + ' km'; }

function renderClock(){
  const now = new Date();
  document.getElementById('time').textContent =
    now.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  // (horloge en Be Vietnam Pro, cf. classe display-font sur #time)
  document.getElementById('date').textContent =
    now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });

  // Recharge complète une fois par jour à l'heure creuse pour repartir sur une base saine.
  if (now.getHours() === RELOAD_HOUR && now.getDate() !== lastLoadedDay){
    location.reload();
  }
}

function renderStats(){
  const counts = { V:0, R:0, D:0, L:0 };
  vehicles.forEach(v => { counts[v.status] = (counts[v.status]||0) + 1; });
  document.getElementById('stats').innerHTML = `
    <div class="stat total"><span class="num">${vehicles.length}</span><span class="label">Véhicules</span></div>
    <div class="stat v"><span class="num">${counts.V}</span><span class="label">En vente</span></div>
    <div class="stat r"><span class="num">${counts.R}</span><span class="label">Réservés</span></div>
  `;
}

function cardHTML(v){
  return `
    <div class="card">
      <div class="photo">
        ${v.photo
          ? `<img src="${v.photo}" alt="${v.brand_model}" onerror="this.parentElement.innerHTML='<div class=\\'noimg\\'>Photo indisponible</div>'">`
          : `<div class="noimg">Pas de photo</div>`}
        <span class="status ${STATUS_CLASS[v.status]||'d'}">${STATUS_LABEL[v.status]||v.status}</span>
      </div>
      <div class="card-body">
        <p class="title">${v.brand_model}</p>
        <p class="variant">${v.variant||''}</p>
        <div class="meta">
          <span>${v.year||''}</span>
          <span>${fmtKm(v.km)}</span>
          <span>${FUEL_LABEL[v.fuel]||v.fuel||''}</span>
          <span>${v.power?v.power+' ch':''}</span>
        </div>
        <div class="footer-row">
          <span class="plate">${v.plate||''}</span>
          <span class="price ${v.price?'':'na'}">${fmtPrice(v.price)}</span>
        </div>
      </div>
    </div>
  `;
}

function buildPages(){
  // On priorise les véhicules "en vente" en tête de rotation
  const sorted = [...vehicles].sort((a,b) => {
    const order = { V:0, R:1, L:2, D:3 };
    return (order[a.status]??9) - (order[b.status]??9);
  });
  pages = [];
  for (let i=0; i<sorted.length; i+=PAGE_SIZE){
    pages.push(sorted.slice(i, i+PAGE_SIZE));
  }
  if (pages.length === 0) pages = [[]];
}

function renderDots(){
  document.getElementById('dots').innerHTML = pages.map((_,i) =>
    `<span class="dot ${i===currentPage?'active':''}"></span>`
  ).join('');
  document.getElementById('pageIndicator').textContent =
    `${currentPage+1} / ${pages.length}`;
}

function renderCurrentPage(){
  const container = document.getElementById('pages');
  const html = pages.map((p,i) => `
    <div class="page ${i===currentPage?'active':''}" data-page="${i}">
      ${p.map(cardHTML).join('')}
    </div>
  `).join('');
  container.innerHTML = html;
  renderDots();
}

function nextPage(){
  currentPage = (currentPage + 1) % pages.length;
  renderCurrentPage();
}

function startRotation(){
  if (rotateTimer) clearInterval(rotateTimer);
  if (pages.length > 1){
    rotateTimer = setInterval(nextPage, ROTATE_MS);
  }
}

async function loadData(){
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const payload = await res.json();
    vehicles = payload.vehicles || [];
    document.getElementById('offlineBanner').classList.remove('show');
    const dt = new Date(payload.generated_at);
    document.getElementById('updatedAt').textContent =
      'Catalogue mis à jour le ' + dt.toLocaleDateString('fr-FR') + ' à ' + dt.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});

    renderStats();
    buildPages();
    currentPage = 0;
    renderCurrentPage();
    startRotation();
  } catch (err) {
    console.error('Erreur de chargement du catalogue :', err);
    document.getElementById('offlineBanner').classList.add('show');
  }
}

renderClock();
setInterval(renderClock, 30000);
loadData();
setInterval(loadData, REFETCH_MS);
</script>
</body>
</html>
